name: Build Golden Mind AI Android APK

on:
  push:
    branches: ["feat/multi-broker-account-orchestration"]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Verify Gradle toolchain
        working-directory: android
        run: gradle --version

      - name: Validate release signing secrets
        env:
          GMAI_KEYSTORE_BASE64: ${{ secrets.GMAI_KEYSTORE_BASE64 }}
          GMAI_KEYSTORE_PASSWORD: ${{ secrets.GMAI_KEYSTORE_PASSWORD }}
          GMAI_KEY_ALIAS: ${{ secrets.GMAI_KEY_ALIAS }}
          GMAI_KEY_PASSWORD: ${{ secrets.GMAI_KEY_PASSWORD }}
        run: |
          test -n "$GMAI_KEYSTORE_BASE64" || { echo "Missing GMAI_KEYSTORE_BASE64"; exit 1; }
          test -n "$GMAI_KEYSTORE_PASSWORD" || { echo "Missing GMAI_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$GMAI_KEY_ALIAS" || { echo "Missing GMAI_KEY_ALIAS"; exit 1; }
          test -n "$GMAI_KEY_PASSWORD" || { echo "Missing GMAI_KEY_PASSWORD"; exit 1; }

      - name: Prepare release signing
        env:
          GMAI_KEYSTORE_BASE64: ${{ secrets.GMAI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/gmai-signing"
          echo "$GMAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gmai-signing/golden-mind-ai-release.jks"
          test -s "$RUNNER_TEMP/gmai-signing/golden-mind-ai-release.jks" || { echo "Decoded keystore is empty"; exit 1; }

      - name: Build release APK
        working-directory: android
        env:
          GMAI_KEYSTORE_PATH: ${{ runner.temp }}/gmai-signing/golden-mind-ai-release.jks
          GMAI_KEYSTORE_PASSWORD: ${{ secrets.GMAI_KEYSTORE_PASSWORD }}
          GMAI_KEY_ALIAS: ${{ secrets.GMAI_KEY_ALIAS }}
          GMAI_KEY_PASSWORD: ${{ secrets.GMAI_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: golden-mind-ai-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
