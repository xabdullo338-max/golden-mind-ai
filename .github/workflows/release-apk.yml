name: Golden Mind AI Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10.2"

      - name: Check release signing secrets
        id: signing
        env:
          GMAI_KEYSTORE_BASE64: ${{ secrets.GMAI_KEYSTORE_BASE64 }}
          GMAI_KEYSTORE_PASSWORD: ${{ secrets.GMAI_KEYSTORE_PASSWORD }}
          GMAI_KEY_ALIAS: ${{ secrets.GMAI_KEY_ALIAS }}
          GMAI_KEY_PASSWORD: ${{ secrets.GMAI_KEY_PASSWORD }}
        run: |
          test -n "$GMAI_KEYSTORE_BASE64"
          test -n "$GMAI_KEYSTORE_PASSWORD"
          test -n "$GMAI_KEY_ALIAS"
          test -n "$GMAI_KEY_PASSWORD"

      - name: Prepare signing keystore
        env:
          GMAI_KEYSTORE_BASE64: ${{ secrets.GMAI_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/gmai-signing"
          echo "$GMAI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gmai-signing/golden-mind-ai-release.jks"
          test -s "$RUNNER_TEMP/gmai-signing/golden-mind-ai-release.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          GMAI_KEYSTORE_PATH: ${{ runner.temp }}/gmai-signing/golden-mind-ai-release.jks
          GMAI_KEYSTORE_PASSWORD: ${{ secrets.GMAI_KEYSTORE_PASSWORD }}
          GMAI_KEY_ALIAS: ${{ secrets.GMAI_KEY_ALIAS }}
          GMAI_KEY_PASSWORD: ${{ secrets.GMAI_KEY_PASSWORD }}
        run: gradle clean assembleRelease --stacktrace -PAPI_BASE_URL=https://golden-mind-ai.vercel.app

      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          ls -lh android/app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
