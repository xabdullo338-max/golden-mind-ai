name: Golden Mind AI CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q tests/test_safety_guards.py tests/test_execution_safety.py tests/test_recovery_safety.py tests/test_order_lifecycle_safety.py
      - run: PYTHONPATH=. pytest -q
