name: Binance TESTNET Smoke

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "TESTNET symbol"
        required: true
        default: "BTCUSDT"
      quote_usdt:
        description: "Small TESTNET quote amount"
        required: true
        default: "10"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      BINANCE_BASE_URL: https://testnet.binance.vision
      BINANCE_TEST_SYMBOL: ${{ inputs.symbol }}
      BINANCE_TEST_QUOTE_USDT: ${{ inputs.quote_usdt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install smoke-test dependencies
        run: python -m pip install httpx websockets

      - name: Run authenticated Binance TESTNET smoke test
        run: python scripts/binance_testnet_smoke.py
